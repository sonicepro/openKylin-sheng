name: Build RootFS (openKylin)

# 为小米平板 6S Pro (sheng, SM8550) 构建 openKylin arm64 rootfs.img + boot.img
#
# 结构参照 code002-2/ubuntu-sheng。openKylin 与 Ubuntu 的关键差异：
#   * 公开的 openKylin arm64 软件归档**缺包**（缺 python3-watchdog / libbytesize1 /
#     libei1 / libgtk-4-1 等），用 debootstrap+apt 装不出 UKUI 桌面。
#   * 因此默认 ROOTFS_SOURCE=image：直接取 **openKylin 官方 arm64 桌面镜像**里
#     已经装好的 rootfs（casper/filesystem.squashfs），再叠加 sheng 设备包。
#   * ROOTFS_SOURCE=debootstrap 保留旧的从零引导路径（归档修好后可用）。
#
# 需要 arm64 runner（ubuntu-24.04-arm）。
on:
  workflow_dispatch:
    inputs:
      rootfs_source:
        description: 'rootfs 来源（image=用官方镜像里的 rootfs，推荐；debootstrap=从零引导）'
        required: true
        type: choice
        default: 'image'
        options:
          - 'image'
          - 'debootstrap'
      openkylin_series:
        description: 'openKylin 版本（仅 debootstrap 模式使用）'
        required: false
        type: choice
        default: 'huanghe (3.0)'
        options:
          - 'huanghe (3.0)'
          - 'nile (2.0)'
          - 'yangtze (1.0)'
      openkylin_iso_url:
        description: 'image 模式下要使用的 openKylin arm64 桌面 ISO 地址'
        required: false
        type: string
        default: 'https://cdimage.openkylin.top/3.0/openKylin-Desktop-V3.0-20260905-arm64.iso'
      desktop:
        description: '桌面环境（image 模式固定为镜像自带的 UKUI；debootstrap 模式可选 UKUI/server）'
        required: false
        type: choice
        default: 'UKUI'
        options:
          - 'UKUI'
          - 'server'
      autologin:
        description: '自动登录（LightDM）'
        required: false
        type: boolean
        default: true
      username:
        description: '普通用户名'
        required: false
        type: string
        default: 'user'
      hostname:
        description: '主机名'
        required: false
        type: string
        default: 'xiaomi-sheng'
      password:
        description: '镜像密码（留空则用 ROOTFS_PASSWORD secret，都为空则为默认 password）；注意输入值会明文显示在运行页面'
        required: false
        type: string
        default: ''
      language:
        description: '系统语言（locale）'
        required: false
        type: choice
        default: 'zh_CN.UTF-8'
        options:
          - 'zh_CN.UTF-8'
          - 'None (C.UTF-8)'
          - 'en_US.UTF-8'
          - 'zh_TW.UTF-8'
          - 'ja_JP.UTF-8'
          - 'ko_KR.UTF-8'
          - 'de_DE.UTF-8'
          - 'fr_FR.UTF-8'
          - 'es_ES.UTF-8'
          - 'ru_RU.UTF-8'
      boot_mode:
        description: '启动分区模式'
        required: true
        type: choice
        default: 'dual (linux)'
        options:
          - 'dual (linux)'
          - 'single (userdata)'
          - 'custom'
      custom_partition:
        description: '自定义分区名（仅 boot_mode=custom 时需要；必须搭配 kernel_source=custom_build）'
        required: false
        type: string
        default: ''
      quiet_boot:
        description: '安静启动（Plymouth，server 模式忽略）'
        required: false
        type: boolean
        default: true
      kernel_source:
        description: '内核来源（custom 分区模式不支持 prebuilt）'
        required: true
        type: choice
        default: 'prebuilt'
        options:
          - 'prebuilt'
          - 'custom_build'
      kernel_repo:
        description: '自定义内核仓库（kernel_source=custom_build 时使用）'
        required: false
        type: string
        default: 'https://github.com/ianchb/sm8550-mainline'
      kernel_branch:
        description: '内核分支'
        required: false
        type: string
        default: 'sheng-7.2.6'
      kernel_config:
        description: '内核配置文件（仓库内文件名）'
        required: false
        type: string
        default: 'sm8550.config'
      kernel_release:
        description: 'prebuilt 内核取哪个 release（留空则取最新；固定版本可复现构建）'
        required: false
        type: string
        default: '7.2.6'
      firmware_repo:
        description: '设备固件仓库'
        required: false
        type: string
        default: 'https://github.com/ianchb/sheng-firmware'
      firmware_branch:
        description: '固件仓库分支'
        required: false
        type: string
        default: 'master'
      shrink_image:
        description: '构建后收缩镜像（e2fsck + resize2fs -M）；31GiB 近满盘上很慢，默认关'
        required: false
        type: boolean
        default: false
      compress_image:
        description: '构建后压缩 rootfs.img（zstd 快 / xz 更小 / none）；刷写前需解压：zstd -d 或 xz -d'
        required: false
        type: choice
        default: 'zstd'
        options:
          - 'zstd'
          - 'xz'
          - 'none'
      upload_artifacts:
        description: '上传 rootfs.img / boot.img 到 Actions Artifact（默认关；Release 为正式产物，重复上传白耗时间）'
        required: false
        type: boolean
        default: false
      create_release:
        description: '把产物发布到 GitHub Release（单文件上限 2GiB，大镜像会自动分片）'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Release tag（留空则自动用 openkylin-<系列>-<桌面>-<分区>；同名则更新附件）'
        required: false
        type: string
        default: ''
permissions:
  contents: write   # 发布 Release 需要
  actions: read
  packages: read

jobs:
  packages:
    name: Build Device Packages
    uses: ./.github/workflows/_packages.yml
    with:
      kernel_source: ${{ inputs.kernel_source }}
      kernel_repo: ${{ inputs.kernel_repo }}
      kernel_branch: ${{ inputs.kernel_branch }}
      kernel_config: ${{ inputs.kernel_config }}
      firmware_repo: ${{ inputs.firmware_repo }}
      firmware_branch: ${{ inputs.firmware_branch }}

  build-rootfs:
    name: Assemble openKylin RootFS
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    needs: [packages]
    env:
      ROOTFS_MOUNT: /mnt/rootfs
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free Disk Space
        # 官方桌面 ISO 的 rootfs 解包后约 31 GiB，加上中间产物，标准 runner 的
        # 默认磁盘不够。删掉预装的大块工具链腾出约 25 GiB。
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo rm -rf /usr/local/lib/node_modules /opt/az /usr/local/aws-cli 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Verify Arguments
        env:
          IN_PASSWORD: ${{ inputs.password }}
          SECRET_PASSWORD: ${{ secrets.ROOTFS_PASSWORD }}
        run: |
          if [ -n "$IN_PASSWORD" ]; then
            echo "::add-mask::$IN_PASSWORD"
            PASSWORD="$IN_PASSWORD"
            echo "镜像密码取自 password 输入项（该值会显示在本页面的输入摘要中，介意请改用 ROOTFS_PASSWORD secret）"
          elif [ -n "$SECRET_PASSWORD" ]; then
            echo "镜像密码取自 ROOTFS_PASSWORD secret"
            PASSWORD="$SECRET_PASSWORD"
          else
            echo "::warning::未设置密码（password 输入与 ROOTFS_PASSWORD secret 均为空），镜像将使用不安全的默认密码 password"
            PASSWORD=""
          fi
          case "$PASSWORD" in
            *$'\n'*) echo "::error::密码不能包含换行"; exit 1 ;;
          esac
          echo "ROOTFS_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          if [ "${{ inputs.boot_mode }}" = "custom" ]; then
            if [ "${{ inputs.kernel_source }}" != "custom_build" ]; then
              echo "::error::boot_mode=custom 必须搭配 kernel_source=custom_build"
              exit 1
            fi
            if [ -z "${{ inputs.custom_partition }}" ]; then
              echo "::error::boot_mode=custom 时必须填写 custom_partition"
              exit 1
            fi
          fi
          case "${{ inputs.custom_partition }}" in
            "") : ;;
            *[!a-zA-Z0-9_-]*) echo "::error::custom_partition 只允许字母数字与 _ -（PARTLABEL 名）"; exit 1 ;;
          esac
          case "${{ inputs.username }}" in
            ""|*[!a-zA-Z0-9_.-]*) echo "::error::username 只允许字母数字与 _ . -"; exit 1 ;;
          esac
          case "${{ inputs.hostname }}" in
            ""|*[!a-zA-Z0-9.-]*) echo "::error::hostname 只允许字母数字与 . -"; exit 1 ;;
          esac
      - name: Parse Arguments
        id: parse
        run: |
          SERIES="${{ inputs.openkylin_series }}"
          SERIES="${SERIES%% *}"
          if [ "${{ inputs.rootfs_source }}" = "image" ]; then
            SERIES="huanghe"   # 官方 arm64 桌面镜像当前为 3.0(huanghe)
          fi

          QUIET="false"
          if [ "${{ inputs.quiet_boot }}" = "true" ] && [ "${{ inputs.desktop }}" != "server" ]; then
            QUIET="true"
          fi

          case "${{ inputs.boot_mode }}" in
            "single (userdata)")
              LABEL="userdata"
              if [ "$QUIET" = "true" ]; then PATTERN="boot_sheng_singleboot_plymouth.img"; else PATTERN="boot_sheng_singleboot.img"; fi
              ;;
            "dual (linux)")
              LABEL="linux"
              if [ "$QUIET" = "true" ]; then PATTERN="boot_sheng_dualboot_plymouth.img"; else PATTERN="boot_sheng_dualboot.img"; fi
              ;;
            "custom")
              LABEL="${{ inputs.custom_partition }}"
              PATTERN=""
              ;;
            *)
              echo "::error::未知的 boot_mode: ${{ inputs.boot_mode }}"
              exit 1
              ;;
          esac

          SLUG="$(printf '%s' "${{ inputs.desktop }}" | tr ' ' '-')"

          {
            echo "series=${SERIES}"
            echo "label=${LABEL}"
            echo "quiet_boot_enabled=${QUIET}"
            echo "boot_img_pattern=${PATTERN}"
            echo "desktop_slug=${SLUG}"
          } >> "$GITHUB_OUTPUT"

          echo "source=${{ inputs.rootfs_source }} / openKylin $SERIES / 分区 $LABEL / quiet=$QUIET"

      - name: Install Host Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debootstrap curl git e2fsprogs squashfs-tools zstd xz-utils

      - name: "[Prebuilt] Download Kernel & boot.img"
        if: inputs.kernel_source != 'custom_build'
        env:
          GH_TOKEN: ${{ github.token }}
          BOOT_IMG_PATTERN: ${{ steps.parse.outputs.boot_img_pattern }}
          KERNEL_RELEASE: ${{ inputs.kernel_release }}
        run: |
          chmod +x scripts/host/10-fetch-kernel.sh
          ./scripts/host/10-fetch-kernel.sh

      - name: "[Custom] Download Kernel Package"
        if: inputs.kernel_source == 'custom_build'
        uses: actions/download-artifact@v8
        with:
          name: kernel-custom-deb
          path: debs

      - name: "[Custom] Download Kernel Image"
        if: inputs.kernel_source == 'custom_build'
        uses: actions/download-artifact@v8
        with:
          name: kernel-custom-image

      - name: "[Custom] Generate boot.img"
        if: inputs.kernel_source == 'custom_build'
        env:
          PARTITION_LABEL: ${{ steps.parse.outputs.label }}
          QUIET_BOOT: ${{ steps.parse.outputs.quiet_boot_enabled }}
        run: |
          chmod +x scripts/host/11-make-bootimg.sh
          ./scripts/host/11-make-bootimg.sh Image.gz-dtb_sheng

      - name: Collect fastrpc
        uses: actions/download-artifact@v8
        with: { name: fastrpc-deb, path: debs }
      - name: Collect libssc
        uses: actions/download-artifact@v8
        with: { name: libssc-deb, path: debs }
      - name: Collect iio-sensor-proxy
        uses: actions/download-artifact@v8
        with: { name: iio-sensor-proxy-deb, path: debs }
      - name: Collect sheng-sensors
        uses: actions/download-artifact@v8
        with: { name: sheng-sensors-deb, path: debs }
      - name: Collect sheng-devauth
        uses: actions/download-artifact@v8
        with: { name: sheng-devauth-deb, path: debs }
      - name: Collect alsa-xiaomi-sheng
        uses: actions/download-artifact@v8
        with: { name: alsa-xiaomi-sheng-deb, path: debs }
      - name: Collect firmware-xiaomi-sheng
        uses: actions/download-artifact@v8
        with: { name: firmware-xiaomi-sheng-deb, path: debs }
      - name: Collect xiaomi-* packages
        uses: actions/download-artifact@v8
        with: { name: xiaomi-debs, path: debs }

      - name: Verify Collected Packages
        run: |
          count="$(find debs -maxdepth 1 -name '*.deb' | wc -l)"
          echo "共收集到 ${count} 个 deb："
          ls -lh debs/ | sed 's/^/    /'

          missing=0
          for p in linux-xiaomi-sheng fastrpc libssc iio-sensor-proxy sheng-sensors \
                   sheng-devauth alsa-xiaomi-sheng firmware-xiaomi-sheng; do
            if ! compgen -G "debs/${p}*.deb" >/dev/null; then
              echo "::error::缺少必需的设备包: ${p}"
              missing=1
            fi
          done

          xiaomi="$(find debs -maxdepth 1 -name 'xiaomi-*.deb' | wc -l)"
          echo "xiaomi-* 包: ${xiaomi} 个"
          if [ "$xiaomi" -lt 6 ]; then
            echo "::warning::xiaomi-* 包少于 6 个（${xiaomi}）：快充/充电模式/触控/手写笔/指纹/键盘 中会有功能缺失"
          fi

          if [ "$missing" -ne 0 ]; then exit 1; fi
          if [ ! -f boot.img ]; then
            echo "::error::缺少 boot.img"
            exit 1
          fi

      - name: "[image] Prepare rootfs from ISO"
        if: inputs.rootfs_source == 'image'
        env:
          OPENKYLIN_ISO_URL: ${{ inputs.openkylin_iso_url }}
          OPENKYLIN_ISO: ${{ github.workspace }}/openkylin.iso
        run: |
          chmod +x scripts/host/05-fetch-rootfs.sh
          sudo -E bash scripts/host/05-fetch-rootfs.sh "$ROOTFS_MOUNT"

      - name: "[debootstrap] Create & Mount RootFS Image"
        if: inputs.rootfs_source == 'debootstrap'
        run: |
          chmod +x scripts/host/00-prepare-image.sh
          sudo bash scripts/host/00-prepare-image.sh rootfs.img 36G "$ROOTFS_MOUNT"

      - name: "[debootstrap] Bootstrap openKylin Base"
        if: inputs.rootfs_source == 'debootstrap'
        run: |
          chmod +x scripts/host/01-bootstrap.sh
          sudo env DISTRO_SERIES="${{ steps.parse.outputs.series }}" \
            bash scripts/host/01-bootstrap.sh "$ROOTFS_MOUNT"

      - name: Mount Chroot Environment
        run: |
          chmod +x scripts/host/02-mount-chroot.sh
          sudo bash scripts/host/02-mount-chroot.sh "$ROOTFS_MOUNT"

      - name: Write Build Environment
        env:
          DISTRO_SERIES: ${{ steps.parse.outputs.series }}
        run: |
          sudo tee "$ROOTFS_MOUNT/root/build.env" >/dev/null <<EOF
          DISTRO_SERIES='${DISTRO_SERIES}'
          ROOTFS_SOURCE='${{ inputs.rootfs_source }}'
          DESKTOP='${{ inputs.desktop }}'
          AUTOLOGIN='${{ inputs.autologin }}'
          USERNAME='${{ inputs.username }}'
          HOSTNAME='${{ inputs.hostname }}'
          LANGUAGE='${{ inputs.language }}'
          QUIET_BOOT='${{ steps.parse.outputs.quiet_boot_enabled }}'
          BOOT_MODE='${{ inputs.boot_mode }}'
          PARTITION_LABEL='${{ steps.parse.outputs.label }}'
          KERNEL_SOURCE='${{ inputs.kernel_source }}'
          EOF
          sudo chmod 600 "$ROOTFS_MOUNT/root/build.env"
          echo "build.env 内容："
          sudo cat "$ROOTFS_MOUNT/root/build.env" | sed 's/^/    /'

      - name: "[chroot] De-live rootfs"
        if: inputs.rootfs_source == 'image'
        run: sudo chroot "$ROOTFS_MOUNT" /root/ok-build/in-chroot/05-de-live.sh

      - name: "[chroot] Install Base Packages"
        if: inputs.rootfs_source == 'debootstrap'
        run: sudo chroot "$ROOTFS_MOUNT" /root/ok-build/in-chroot/10-base.sh

      - name: "[chroot] Install Desktop"
        if: inputs.rootfs_source == 'debootstrap'
        run: sudo chroot "$ROOTFS_MOUNT" /root/ok-build/in-chroot/20-desktop.sh

      - name: "[chroot] Install Device Packages"
        run: sudo chroot "$ROOTFS_MOUNT" /root/ok-build/in-chroot/30-device-packages.sh

      - name: Prepare Password File
        run: |
          if [ -n "${ROOTFS_PASSWORD:-}" ]; then
            printf '%s' "$ROOTFS_PASSWORD" | sudo tee "$ROOTFS_MOUNT/root/build.pw" >/dev/null
            sudo chmod 600 "$ROOTFS_MOUNT/root/build.pw"
          else
            echo "::warning::未设置密码，镜像密码将是 password"
          fi

      - name: "[chroot] Configure System"
        run: sudo chroot "$ROOTFS_MOUNT" /root/ok-build/in-chroot/40-system-config.sh

      - name: "[chroot] Verify Image"
        run: sudo chroot "$ROOTFS_MOUNT" /root/ok-build/in-chroot/90-verify.sh

      - name: Cleanup Host Files
        if: always()
        run: |
          sudo rm -f "$ROOTFS_MOUNT/etc/resolv.conf" 2>/dev/null || true
          sudo rm -f "$ROOTFS_MOUNT/root/build.pw" 2>/dev/null || true
          sudo rm -rf "$ROOTFS_MOUNT/root/ok-build" 2>/dev/null || true
          sudo rm -rf "$ROOTFS_MOUNT/tmp/debs" 2>/dev/null || true

      - name: Unmount Virtual File Systems
        if: always()
        run: sudo bash scripts/host/03-umount-chroot.sh "$ROOTFS_MOUNT"

      - name: Finalize Image
        if: success()
        run: |
          chmod +x scripts/host/04-finalize-image.sh
          sudo env SHRINK_IMAGE="${{ inputs.shrink_image }}" \
                   COMPRESS_IMAGE="${{ inputs.compress_image }}" \
            bash scripts/host/04-finalize-image.sh rootfs.img "$ROOTFS_MOUNT"

      - name: Upload RootFS Image (raw)
        if: success() && inputs.upload_artifacts && inputs.compress_image == 'none'
        uses: actions/upload-artifact@v7
        with:
          name: rootfs-openkylin-${{ steps.parse.outputs.series }}-${{ steps.parse.outputs.desktop_slug }}-${{ steps.parse.outputs.label }}
          path: rootfs.img
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

      - name: Upload RootFS Image (compressed)
        if: success() && inputs.upload_artifacts && inputs.compress_image != 'none'
        uses: actions/upload-artifact@v7
        with:
          name: rootfs-openkylin-${{ steps.parse.outputs.series }}-${{ steps.parse.outputs.desktop_slug }}-${{ steps.parse.outputs.label }}-${{ inputs.compress_image }}
          path: ${{ inputs.compress_image == 'xz' && 'rootfs.img.xz' || 'rootfs.img.zst' }}
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

      - name: Upload Boot Image
        if: success() && inputs.upload_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: boot-openkylin-${{ steps.parse.outputs.series }}-${{ steps.parse.outputs.desktop_slug }}-${{ steps.parse.outputs.label }}
          path: boot.img
          retention-days: 14
          compression-level: 1
          if-no-files-found: warn

      - name: Prepare release assets
        if: success() && inputs.create_release
        run: |
          set -euo pipefail
          mkdir -p release-assets
          if [ "${{ inputs.compress_image }}" = "none" ]; then IMG="rootfs.img"
          elif [ "${{ inputs.compress_image }}" = "xz" ]; then IMG="rootfs.img.xz"
          else IMG="rootfs.img.zst"; fi
          echo "镜像文件: $IMG ($(du -h "$IMG" | cut -f1))"
          # GitHub Release 单附件上限 2GiB → 超过就分片为 <1900MiB 的 part-*
          LIMIT=$((1900 * 1024 * 1024))
          SZ="$(stat -c%s "$IMG")"
          if [ "$SZ" -gt "$LIMIT" ]; then
            echo "超过 2GiB，分片"
            split -b 1900M -d -a 2 "$IMG" "release-assets/$(basename "$IMG").part-"
          else
            cp "$IMG" release-assets/
          fi
          cp boot.img release-assets/
          ls -lh release-assets/ | sed 's/^/    /'

      - name: Publish to GitHub Release
        if: success() && inputs.create_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          [ -n "$TAG" ] || TAG="openkylin-${{ steps.parse.outputs.series }}-${{ steps.parse.outputs.desktop_slug }}-${{ steps.parse.outputs.label }}"
          PRE="--prerelease"   # 实验性端口固定标为 pre-release
          echo "Release tag: $TAG"
          cat > /tmp/notes.md <<'EOF'
          为小米平板 6S Pro（sheng / SM8550）构建的 openKylin arm64 镜像。

          **附件**
          - `boot.img` — sheng 内核 boot 镜像
          - `rootfs.img`（或 `.zst`/`.xz`，或分片 `.part-*`）— 系统镜像

          **刷写前处理**
          - 分片（`.part-*`）：先合并  `cat rootfs.img.*.part-* > rootfs.img.*`
          - 压缩（`.zst`/`.xz`）：先解压  `zstd -d rootfs.img.zst`  或  `xz -d rootfs.img.xz`

          **刷写**（详见 Xiaomi-pad-6s-pro-Linux 安装指南）
          - 双系统：`fastboot flash linux rootfs.img` + `fastboot flash boot_b boot.img`
          - 单系统：分区名用 `userdata`
          - 首启后 `sudo resize2fs /dev/sda30`（或对应分区）
          EOF
          {
            echo ""
            echo "---"
            echo "- openKylin: ${{ steps.parse.outputs.series }} / 桌面: ${{ inputs.desktop }} / 分区: ${{ steps.parse.outputs.label }}"
            echo "- 内核: ${{ inputs.kernel_source }} (${{ inputs.kernel_release }})"
          } >> /tmp/notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，更新附件（--clobber）"
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md $PRE release-assets/*
          fi

      - name: Build Summary
        if: always()
        run: |
          {
            echo "## openKylin RootFS 构建结果"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| rootfs 来源 | ${{ inputs.rootfs_source }} |"
            echo "| openKylin | ${{ steps.parse.outputs.series }} |"
            echo "| 桌面环境 | ${{ inputs.desktop }} |"
            echo "| 分区（PARTLABEL） | ${{ steps.parse.outputs.label }} |"
            echo "| 内核来源 | ${{ inputs.kernel_source }} |"
            echo "| quiet boot | ${{ steps.parse.outputs.quiet_boot_enabled }} |"
            echo "| rootfs.img | $(du -h rootfs.img 2>/dev/null | cut -f1 || echo 'N/A') |"
            echo "| boot.img | $(du -h boot.img 2>/dev/null | cut -f1 || echo 'N/A') |"
            echo "| 设备包数量 | $(find debs -maxdepth 1 -name '*.deb' 2>/dev/null | wc -l) |"
          } >> "$GITHUB_STEP_SUMMARY"
