name: _Build Device Packages (Ubuntu)

# 可复用工作流：构建 Ubuntu 侧的全部设备功能包（.deb）
# 由 rootfs.yml 通过 workflow_call 调用。本仓库刻意不设 rootfs-lite.yml：
# 上游是用"再复制一份 45 KB YAML"来实现测试模式，这里改为 rootfs.yml 的
# upload_artifacts 输入项。
#
# 作业与上游 debian-sheng 一一对应：
#   build-kernel(custom_build) / build-fastrpc / build-libssc /
#   build-iio-sensor-proxy / build-sheng-sensors / build-sheng-devauth /
#   package-alsa / package-firmware / fetch-xiaomi-debs
on:
  workflow_call:
    inputs:
      kernel_source:
        description: 'prebuilt 或 custom_build'
        required: false
        type: string
        default: 'prebuilt'
      kernel_repo:
        description: '自定义内核仓库 URL（kernel_source=custom_build 时使用）'
        required: false
        type: string
        default: 'https://github.com/ianchb/sm8550-mainline'
      kernel_branch:
        description: '内核仓库分支'
        required: false
        type: string
        default: 'sheng-7.2.6'
      kernel_config:
        description: '内核配置文件（仓库内文件名）'
        required: false
        type: string
        default: 'sm8550.config'
      firmware_repo:
        description: '设备固件仓库 URL'
        required: false
        type: string
        default: 'https://github.com/ianchb/sheng-firmware'
      firmware_branch:
        description: '固件仓库分支'
        required: false
        type: string
        default: 'master'
    outputs:
      kernel_version:
        description: 'custom_build 时的内核版本'
        value: ${{ jobs.build-kernel.outputs.kernel_version }}

permissions:
  contents: read
  packages: read

jobs:
  build-kernel:
    name: Build Kernel (custom_build)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    outputs:
      kernel_version: ${{ steps.build.outputs.kernel_version }}
    steps:
      - name: Skip (Prebuilt Kernel)
        if: inputs.kernel_source != 'custom_build'
        run: echo "✓ kernel_source=prebuilt，跳过内核编译"

      - uses: actions/checkout@v7
        if: inputs.kernel_source == 'custom_build'

      - name: Install Build Tools
        if: inputs.kernel_source == 'custom_build'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential flex bison libssl-dev libelf-dev \
            bc ccache clang llvm lld kmod
          ccache --set-config=max_size=10G || true

      - name: Restore ccache
        if: inputs.kernel_source == 'custom_build'
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-kernel-ubuntu-${{ inputs.kernel_branch }}-${{ inputs.kernel_config }}-${{ hashFiles(inputs.kernel_config) }}
          restore-keys: |
            ccache-kernel-ubuntu-${{ inputs.kernel_branch }}-${{ inputs.kernel_config }}-
            ccache-kernel-ubuntu-

      - name: Build Kernel
        id: build
        if: inputs.kernel_source == 'custom_build'
        env:
          KERNEL_REPO: ${{ inputs.kernel_repo }}
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}
          KERNEL_CONFIG: ${{ inputs.kernel_config }}
        run: |
          chmod +x scripts/packages/build-kernel.sh
          ./scripts/packages/build-kernel.sh

      - name: Upload Kernel Package
        if: inputs.kernel_source == 'custom_build'
        uses: actions/upload-artifact@v7
        with:
          name: kernel-custom-deb
          path: linux-xiaomi-sheng.deb
          retention-days: 3
          if-no-files-found: error

      - name: Upload Kernel Image
        if: inputs.kernel_source == 'custom_build'
        uses: actions/upload-artifact@v7
        with:
          name: kernel-custom-image
          path: Image.gz-dtb_sheng
          retention-days: 3
          if-no-files-found: error

  build-fastrpc:
    name: Build fastrpc
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install Build Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential autoconf automake libtool pkg-config \
            git wget unzip dpkg-dev libyaml-dev linux-libc-dev
      - name: Build
        run: |
          chmod +x scripts/packages/build-fastrpc.sh
          ./scripts/packages/build-fastrpc.sh
      - uses: actions/upload-artifact@v7
        with:
          name: fastrpc-deb
          path: fastrpc_*.deb
          retention-days: 3
          if-no-files-found: error

  build-libssc:
    name: Build libssc
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install Build Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential ninja-build git pkg-config python3-pip \
            libglib2.0-dev libprotobuf-c-dev libqmi-glib-dev libmbim-glib-dev \
            linux-libc-dev protobuf-compiler protobuf-c-compiler patch
      - name: Build
        run: |
          chmod +x scripts/packages/build-libssc.sh
          ./scripts/packages/build-libssc.sh
      - uses: actions/upload-artifact@v7
        with:
          name: libssc-deb
          path: libssc_*.deb
          retention-days: 3
          if-no-files-found: error

  build-iio-sensor-proxy:
    name: Build iio-sensor-proxy (SSC)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    needs: [build-libssc]
    steps:
      - uses: actions/checkout@v7
      - name: Install Build Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential ninja-build git pkg-config python3-pip wget \
            libglib2.0-dev libgudev-1.0-dev libpolkit-gobject-1-dev libsystemd-dev libdbus-1-dev \
            systemd libqmi-glib-dev libmbim-glib-dev linux-libc-dev \
            protobuf-compiler protobuf-c-compiler
      - uses: actions/download-artifact@v8
        with:
          name: libssc-deb
      - name: Build
        run: |
          chmod +x scripts/packages/build-iio-sensor-proxy.sh
          ./scripts/packages/build-iio-sensor-proxy.sh
      - uses: actions/upload-artifact@v7
        with:
          name: iio-sensor-proxy-deb
          path: iio-sensor-proxy_*.deb
          retention-days: 3
          if-no-files-found: error

  build-sheng-sensors:
    name: Package sheng-sensors
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Build Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev
      - name: Package
        run: |
          chmod +x scripts/packages/build-sheng-sensors.sh
          ./scripts/packages/build-sheng-sensors.sh
      - uses: actions/upload-artifact@v7
        with:
          name: sheng-sensors-deb
          path: sheng-sensors_*.deb
          retention-days: 3
          if-no-files-found: error

  build-sheng-devauth:
    name: Build sheng-devauth
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Build Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential dpkg-dev git
      - name: Build
        run: |
          chmod +x scripts/packages/build-sheng-devauth.sh
          ./scripts/packages/build-sheng-devauth.sh
      - uses: actions/upload-artifact@v7
        with:
          name: sheng-devauth-deb
          path: sheng-devauth.deb
          retention-days: 3
          if-no-files-found: error

  package-alsa:
    name: Package alsa-xiaomi-sheng
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Build Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev
      - name: Package
        run: |
          chmod +x scripts/packages/build-alsa.sh
          ./scripts/packages/build-alsa.sh
      - uses: actions/upload-artifact@v7
        with:
          name: alsa-xiaomi-sheng-deb
          path: alsa-xiaomi-sheng.deb
          retention-days: 3
          if-no-files-found: error

  package-firmware:
    name: Package firmware-xiaomi-sheng
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Build Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev git
      - name: Package
        env:
          FIRMWARE_REPO: ${{ inputs.firmware_repo }}
          FIRMWARE_BRANCH: ${{ inputs.firmware_branch }}
        run: |
          chmod +x scripts/packages/build-firmware.sh
          ./scripts/packages/build-firmware.sh
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-xiaomi-sheng-deb
          path: firmware-xiaomi-sheng.deb
          retention-days: 3
          if-no-files-found: error

  fetch-xiaomi-debs:
    name: Fetch xiaomi-* packages
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/packages/fetch-xiaomi-debs.sh
          ./scripts/packages/fetch-xiaomi-debs.sh
      - uses: actions/upload-artifact@v7
        with:
          name: xiaomi-debs
          path: deb-out/*.deb
          retention-days: 3
          if-no-files-found: error
