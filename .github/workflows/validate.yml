name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shell 语法与 lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: bash -n 语法检查
        run: |
          mapfile -t files < <(find scripts -name '*.sh' | sort)
          printf '检查 %d 个脚本\n' "${#files[@]}"
          for f in "${files[@]}"; do
            bash -n "$f" && echo "  ok  $f" || { echo "  FAIL $f"; exit 1; }
          done
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          mapfile -t files < <(find scripts -name '*.sh' | sort)
          # -x：跟随 source 指令；对 in-chroot 里 source 镜像内路径的脚本，
          # shellcheck 可能报 SC1091（找不到文件），这里放宽为 warning 不失败。
          shellcheck -x -e SC1091 "${files[@]}"

  yaml:
    name: YAML 语法检查
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Parse workflows
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          ok = True
          for f in sorted(glob.glob('.github/workflows/*.yml')):
              try:
                  yaml.safe_load(open(f, encoding='utf-8'))
                  print('  ok  ' + f)
              except Exception as e:
                  ok = False
                  print('  FAIL ' + f + ': ' + str(e))
          sys.exit(0 if ok else 1)
          PY
